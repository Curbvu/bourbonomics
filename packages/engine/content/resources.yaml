# ============================================================
# Bourbonomics — Resource & Capital Card Catalog (v2.11)
# ============================================================
#
# Documentation mirror of what `defaultMarketSupply()` in
# `packages/engine/src/defaults.ts` actually mints. This file is not
# loaded by the engine at runtime — the TS catalog is the source of
# truth. Keep this YAML in sync by hand so the rule docs and the
# Bourbon Wiki gallery never drift.
#
# v2.11 — "Three Bands, One Unit." The resource economy collapses to
# three bands of 1-unit cards:
#
#   Common ($1)     1 unit, basic, no effect
#   Specialty ($2)  1 unit, satisfies `minSpecialty.<subtype>` gates
#   Heritage ($3)   1 unit, satisfies `minSpecialty.<subtype>` gates,
#                   per-card on-sale bonus hook (the `effect` field —
#                   no Heritage card ships a populated bonus in v2.11)
#
# The v2.10 uniform "+1 rep on sale per Specialty" bonus is retired.
# Capitals collapse onto $1 / $3 / $5 face values; cost == value.
#
# Field reference:
#   defId         — engine identifier (snake_case, stable across tunings)
#   displayName   — on-card label
#   subtype       — cask | corn | rye | barley | wheat  (resources)
#   resourceCount — units the card supplies (uniformly 1 in v2.11)
#   capitalValue  — only on capital cards: face value when paid
#   cost          — market price (1¢ = 1 capital unit)
#   band          — common | specialty | heritage  (resource bands)
#   copies        — number of copies in the supply
#   effect        — { kind, when, ...params } | null
#   flavor        — short tagline for the inspect modal

cards:
  # ─── Common ($1, 1 unit) — basic 5 subtypes ────────────────────
  - defId: cask
    displayName: Common Cask
    flavor: Charred, sealed, waiting on you.
    subtype: cask
    resourceCount: 1
    cost: 1
    band: common
    copies: 5
    effect: null

  - defId: corn
    displayName: Common Corn
    flavor: Does most of the work, gets none of the credit.
    subtype: corn
    resourceCount: 1
    cost: 1
    band: common
    copies: 5
    effect: null

  - defId: rye
    displayName: Common Rye
    flavor: Pepper for the patient.
    subtype: rye
    resourceCount: 1
    cost: 1
    band: common
    copies: 5
    effect: null

  - defId: barley
