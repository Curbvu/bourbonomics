# ============================================================
# Bourbonomics — Investment Card Catalog (Source of Truth)
# ============================================================
#
# This is the canonical, human-editable catalog of investment cards.
# The engine reads from `packages/engine/src/defaults.ts`
# (`defaultInvestmentCatalog`), which is a manually-maintained TypeScript
# mirror of this file. When you edit a card here, mirror the change in
# defaults.ts and re-run tests.
#
# Each card has:
#   defId           — engine identifier (snake_case, stable across tunings)
#   name            — display label
#   tier            — small (cost 2-4) | medium (cost 5-8) | large (cost 8-15)
#   cost            — market price in card-units
#   category        — primary system the card touches
#   triggers        — when the effect fires (one or more)
#   archetype       — the strategy axis this card amplifies
#   rate_limited    — true if the card has a per-round trigger cap
#   rate_limit_scope — the cap, e.g. "1/round" (only when rate_limited)
#   short           — tile tagline (≤ ~7 words)
#   text            — player-facing rule text printed on the card
#   description     — designer-facing strategic flavor / rationale
#   implemented     — true | false. False = wired up but engine does not
#                     resolve the effect yet.
#
# Distribution: 7 small / 7 medium / 6 large = 20 cards.
# By category: 8 sales · 4 deck · 2 slots · 2 market · 1 aging ·
#              1 demand · 1 info · 1 endgame.
# By archetype: 5 volume · 5 flex · 4 patience · 3 engine · 2 specialty
#               · 1 tempo.

cards:
  # ─── Small (cost 2-4) ─────────────────────────────────────────
  - defId: trade_school
    name: Trade School
    tier: small
    cost: 3
    category: deck
    triggers: [round_end]
    archetype: engine
    rate_limited: true
    rate_limit_scope: 1/round
    short: Free trash, every round
    text: At end of every round, you may trash 1 card from your hand for free. The spent card is removed from the game.
    description: A persistent deck-thinning engine. Standard "Trash a Card" costs 1 to trash 1 — Trade School removes that tax and lets you sculpt your deck across the whole game without giving up tempo.
    implemented: false

  - defId: tasting_room
    name: Tasting Room
    tier: small
    cost: 4
    category: sales
    triggers: [on_sell]
    archetype: patience
    rate_limited: false
    short: Reward the patient sale
    text: When you sell a barrel age 5 or older, gain +2 reputation.
    description: A small but reliable bonus for patient cellar play. Cheap because the age-5 gate is hard to satisfy early — a freshly-completed barrel needs three rounds of aging before this card pays out at all.
    implemented: false

  - defId: insider_network
    name: Insider Network
    tier: small
    cost: 3
    category: info
    triggers: [other_player_action]
    archetype: flex
    rate_limited: false
    short: See what's coming
    text: Whenever any other player rolls demand, you may peek at the top 2 mash bills of the bourbon deck.
    description: A pure information engine. You don't score directly, but you'll know what bills are about to flip face-up — useful for timing bill draws, blind-deck draws, and even sale timing if you can predict opponents.
    implemented: false

  - defId: grain_contract
    name: Grain Contract
    tier: small
    cost: 4
    category: deck
    triggers: [on_make]
    archetype: volume
    rate_limited: true
    rate_limit_scope: 1/round
    short: First grain refunds a card
    text: The first time each round you commit any grain card to a barrel, draw 1 card.
    description: A modest deck-cycling engine for production-heavy players. Once per round, your first grain commitment pays you back a card — slightly offsetting the holding cost of running multiple barrels in parallel.
    implemented: false

  - defId: marketing_budget
    name: Marketing Budget
    tier: small
    cost: 3
    category: market
    triggers: [on_buy_market]
    archetype: flex
    rate_limited: true
    rate_limit_scope: 1/round
    short: One discount per round
    text: Once per round, when you buy a card from the market, that card costs 1 less (floor 1).
    description: A small recurring discount on market purchases. The savings compound across a long game — over 8 rounds, that's 8 saved cards if you buy every round.
    implemented: false

  - defId: recipe_archive
    name: Recipe Archive
    tier: small
    cost: 2
    category: slots
    triggers: [on_sell]
    archetype: volume
    rate_limited: false
    short: Common bills stick around
    text: When a barrel sells with no award, the bill stays Staged in the slot instead of going to the bourbon discard.
    description: Synthesizes Silver-style retention into common bills. Without this card, selling an unawarded barrel opens the slot fully — Recipe Archive lets that recipe stick around, ready for fresh commits next turn.
    implemented: false

  - defId: counter_cyclical_fund
    name: Counter-Cyclical Fund
    tier: small
    cost: 4
    category: sales
    triggers: [on_sell]
    archetype: flex
    rate_limited: false
    short: Survive a soft market
    text: When you sell at demand 3 or lower, read the grid as if demand were +3 (so demand 3 reads as demand 6).
    description: Lets you sell into low-demand markets without taking the bad-market payout. A useful hedge when demand crashes mid-game — instead of waiting for recovery, you can liquidate at demand 2 and read the grid at demand 5.
    implemented: false

  # ─── Medium (cost 5-8) ────────────────────────────────────────
  - defId: cooperage_stake
    name: Cooperage Stake
    tier: medium
    cost: 5
    category: deck
    triggers: [on_make]
    archetype: volume
    rate_limited: false
    short: Every cask draws a card
    text: Whenever you commit a cask to a barrel, draw 1 card.
    description: The cask-economy engine. Cask is the universal recipe requirement — every barrel needs exactly 1 — so this card fires reliably across the entire game. Functions almost like a permanent +1 to draws per barrel built.
    implemented: false

  - defId: distribution_deal
    name: Distribution Deal
    tier: medium
    cost: 6
    category: deck
    triggers: [on_sell]
    archetype: volume
    rate_limited: false
    short: Sales refill the hand
    text: When you sell a barrel, draw 2 cards from your deck.
    description: Solves the "selling drains your deck" problem. Without it, high-volume sellers find their hand thinning round over round. With it, every sale puts cards back in your hand — making "sell often" a viable archetype.
    implemented: false

  - defId: brand_equity
    name: Brand Equity
    tier: medium
    cost: 7
    category: sales
    triggers: [on_sell]
    archetype: engine
    rate_limited: false
    short: Sales snowball
    text: When you sell a barrel, gain +1 reputation per barrel previously sold this game (cap +5).
    description: The classic snowball. Bought round 2 and triggered on every subsequent sale, this card can pay 1+1+2+3+4+5+5+5 = 26 reputation across 8 sales. Bought round 6, you might only see two activations. Timing is everything.
    implemented: false

  - defId: distillation_license
    name: Distillation License
    tier: medium
    cost: 5
    category: sales
    triggers: [on_complete]
    archetype: volume
    rate_limited: false
    short: Reward for finishing
    text: When a barrel transitions from Building to Aging (recipe satisfied), gain +1 reputation immediately.
    description: Rewards completion, not selling. The only investment that pays you for finishing a recipe regardless of whether the barrel ever sells — useful as a hedge against the final round, where uncompleted barrels are a total loss.
    implemented: false

  - defId: trade_lobby
    name: Trade Lobby
    tier: medium
    cost: 6
    category: demand
    triggers: [turn_start]
    archetype: flex
    rate_limited: true
    rate_limit_scope: 1/round
    short: Nudge demand each round
    text: At the start of your turn, after rolling demand, you may shift demand by ±1 (your choice). Once per round.
    description: A permanent mini-Market-Manipulation. Where the ops card costs 3 for one shift, Trade Lobby gives you a shift every round for the rest of the game — a far better long-term deal but a worse short-term price.
    implemented: false

  - defId: hedge_fund
    name: Hedge Fund
    tier: medium
    cost: 7
    category: sales
    triggers: [on_sell]
    archetype: tempo
    rate_limited: false
    short: Hot markets pay double
    text: When you sell at demand 8 or higher, gain +3 reputation, AND demand drops by 0 instead of 1 from your sale.
    description: A boom-time amplifier. Sells into hot markets are already the best sales — Hedge Fund makes them dramatically better, and prevents the usual "selling tanks demand" feedback loop. Useless if you sell into low markets.
    implemented: false

  - defId: rd_department
    name: R&D Department
    tier: medium
    cost: 8
    category: market
    triggers: [on_buy_market]
    archetype: specialty
    rate_limited: false
    short: Specialty cards, half off
    text: When you buy a Specialty or Double Specialty card from the market, that card costs 2 less, AND it goes to your hand instead of your discard.
    description: A premium-card engine. Specialty cards are expensive ($3–$6) and slow to use because they go to discard before reaching hand. R&D Department halves the cost AND fast-tracks them into immediate use. The defining card for specialty-heavy strategies.
    implemented: false

  # ─── Large (cost 8-15) ────────────────────────────────────────
  - defId: brand_ambassador
    name: Brand Ambassador
    tier: large
    cost: 8
    category: sales
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: One barrel reads +2 demand
    text: On purchase, choose one of your aging barrels. For the rest of the game, that specific barrel reads its grid as if demand were +2 when sold.
    description: Migrated from the ops deck (formerly Master Distiller) into investments where the permanent effect properly belongs. The most accessible large investment and a strong pick for patient players who plan to age a single high-value barrel for many rounds.
    implemented: false

  - defId: premium_label
    name: Premium Label
    tier: large
    cost: 9
    category: sales
    triggers: [on_sell]
    archetype: specialty
    rate_limited: false
    short: Specialty barrels pay extra
    text: When you sell a barrel containing 2 or more Specialty cards, gain +3 reputation. Stacks with the per-Specialty +1 reputation bonus already built into the rules.
    description: Doubles down on the specialty axis. A barrel with 2 Specialty cards already pays +2 rep on sale; Premium Label pushes that to +5. Expensive because it requires a Specialty-heavy strategy to even fire.
    implemented: false

  - defId: land_acquisition
    name: Land Acquisition
    tier: large
    cost: 10
    category: slots
    triggers: [on_purchase]
    archetype: engine
    rate_limited: false
    short: +1 permanent rickhouse slot
    text: Permanently +1 rickhouse slot (max 6, stacks with Rickhouse Expansion Permit and similar effects).
    description: Migrated from the ops deck (formerly Rickhouse Expansion Permit at cost 6) into investments at cost 10, reflecting the actual long-term value of a permanent slot. Strong for engine players who want to push 5+ barrels through the pipeline.
    implemented: false

  - defId: bonded_warehouse
    name: Bonded Warehouse
    tier: large
    cost: 12
    category: aging
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: One slot ages itself
    text: On purchase, designate one of your slots as "bonded." Barrels in the bonded slot age 1 year automatically each round and do not require an aging card from your hand on your turn.
    description: The first card to directly attack v2.9's mandatory holding-cost mechanic. With one slot bonded, you save 5–8 aging cards across the rest of the game. Pairs naturally with Tasting Room and Vintage Reserve.
    implemented: false

  - defId: vintage_reserve
    name: Vintage Reserve
    tier: large
    cost: 13
    category: sales
    triggers: [on_sell]
    archetype: patience
    rate_limited: false
    short: Triple value at age 7+
    text: When you sell a barrel age 7 or older, triple the grid value of that sale.
    description: The hold-for-the-long-game wager. A 7-year barrel at high demand might pay 8 reputation off the grid — Vintage Reserve makes it 24. The biggest single-sale payout in the game, gated behind one of the hardest setups.
    implemented: false

  - defId: bourbon_hall_of_fame
    name: Bourbon Hall of Fame
    tier: large
    cost: 15
    category: endgame
    triggers: [final_scoring]
    archetype: flex
    rate_limited: false
    short: +1 rep per distinct bill sold
    text: At the end of the game, gain +1 reputation per distinct mash bill name you sold during the game (cap +6).
    description: The diversification objective — the only investment whose payout is end-game only. Pushes against the spam-one-bill strategy by rewarding breadth of production. The most expensive card in the deck.
    implemented: false
