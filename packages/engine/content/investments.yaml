# ============================================================
# Bourbonomics — Investment Card Catalog (Source of Truth)
# ============================================================
#
# This is the canonical, human-editable catalog of investment cards.
# The engine reads from `packages/engine/src/defaults.ts`
# (`defaultInvestmentCatalog`), which is a manually-maintained
# TypeScript mirror of this file. When you edit a card here, mirror
# the change in defaults.ts and re-run tests.
#
# Each card has:
#   defId           — engine identifier (snake_case, stable across tunings)
#   name            — display label
#   tier            — small (cost 3–4) | medium (cost 5–8) | large (cost 9–15)
#   cost            — market price in card-units
#   category        — primary system the card touches
#   triggers        — when the effect fires (one or more)
#   archetype       — strategy axis this card amplifies
#   rate_limited    — true if the card has a per-round trigger cap
#   rate_limit_scope — the cap, e.g. "1/round" (only when rate_limited)
#   short           — tile tagline (≤ ~7 words)
#   text            — player-facing rule text printed on the card
#   description     — designer-facing strategic flavor / rationale
#   implemented     — true | false. False = wired up but engine does
#                     not resolve the effect yet.
#
# v3.6 catalog: 33 cards · 9 small · 13 medium · 11 large.
# Grounded in real-world distillery capital expenditures (stills,
# mash tuns, warehouses, cooperages, climate control, bottling
# lines, visitor centers, sales offices, marketing departments).
# v3.6 wires effect resolution: 28 cards are now `implemented: true`.
# Five remain `implemented: false` pending follow-up design:
# field_office, marketing_department, sales_office, cooperage,
# column_still.

cards:
  # ─── Small (cost 3–4) ─────────────────────────────────────────
  - defId: tasting_room
    name: Tasting Room
    tier: small
    cost: 4
    category: sales
    triggers: [on_sell]
    archetype: patience
    rate_limited: false
    short: Patient sales pay extra
    text: When you sell a barrel aged 5 or older, gain +1 Capital.
    description: >
      Reliable small bonus for patient cellar play. Pairs with
      Vintage Reserve and Tasting Notes. Repriced from the v3.4
      catalog (3→4) and per-sale value (2→1).
    implemented: true

  - defId: grain_contract
    name: Grain Contract
    tier: small
    cost: 4
    category: deck
    triggers: [on_make]
    archetype: volume
    rate_limited: true
    rate_limit_scope: 1/round
    short: First grain refunds a card
    text: The first time each round you commit any grain card to a barrel, draw 1 card.
    description: >
      Deck-cycling engine for production-heavy players. Once per
      round, your first grain commitment pays you back a card —
      slightly offsetting the holding cost of running multiple
      barrels in parallel.
    implemented: true

  - defId: tasting_notes
    name: Tasting Notes
    tier: small
    cost: 3
    category: deck
    triggers: [on_sell]
    archetype: engine
    rate_limited: false
    short: Reward placement over inventory
    text: >
      When you sell a barrel AND place the resulting bottle on a
      portfolio slot, draw 2 cards. If the bottle goes to inventory
      instead, draw 1 card.
    description: >
      Pushes against the 'stash everything in inventory' pattern.
      Direct portfolio interaction — the only Small-tier card that
      touches the v3.2 portfolio system.
    implemented: true

  - defId: field_office
    name: Field Office
    tier: small
    cost: 4
    category: info
    triggers: [on_purchase]
    archetype: flex
    rate_limited: false
    short: Scout the secondary pool
    text: >
      On purchase, look at every face-up secondary portfolio's
      full slot table. Reveal any one to all players (the rest stay
      your private knowledge until they're drafted).
    description: >
      Information card for second-portfolio meta. Asymmetric — you
      know more, you control disclosure.
    implemented: false

  - defId: warehouse
    name: Warehouse
    tier: small
    cost: 4
    category: deck
    triggers: [passive_permanent]
    archetype: flex
    rate_limited: false
    short: Carry one card between rounds
    text: >
      On purchase, gain a private Warehouse slot. At any time
      during your turn, you may set aside one card from your hand
      into your Warehouse. The Warehouse holds at most one card.
      The stored card persists across rounds and is not discarded
      at End Turn. On any future turn, you may move the Warehouse
      card back into your hand as a free action.
    description: >
      The only persistent-card-storage option in v3.5 — the free
      Save Slot is gone. Every player will want one. The Warehouse
      unlock fires immediately on buy (see
      PlayerState.warehouseUnlocked); the in/out flow lands with
      the v3.6 effect wave.
    implemented: true

  - defId: visitor_center
    name: Visitor Center
    tier: small
    cost: 4
    category: sales
    triggers: [on_sell]
    archetype: flex
    rate_limited: false
    short: Tourists buy bottles
    text: >
      When you sell a barrel, gain +1 Capital. If the barrel's
      source bill carries the gold-eligible or silver-eligible
      tag, gain +2 Capital instead.
    description: >
      Tag-aware (v3.4). Bourbon tourism is real revenue. Pays on
      every sale regardless of age; bigger payoff on
      award-eligible bills.
    implemented: true

  - defId: rail_spur
    name: Rail Spur
    tier: small
    cost: 3
    category: market
    triggers: [on_buy_market]
    archetype: tempo
    rate_limited: true
    rate_limit_scope: 1/round
    short: Direct shipments
    text: The first market purchase you make each round costs 1 less Capital (floor 1).
    description: >
      Persistent buy discount. Works on any market card.
    implemented: true

  - defId: watchman
    name: Watchman
    tier: small
    cost: 3
    category: defense
    triggers: [passive_permanent]
    archetype: flex
    rate_limited: false
    short: Sleeps in the warehouse
    text: >
      Whenever an opponent targets one of your barrels with a Whiskey
      Raid (or future attack), add +1 to your defense roll. Multiple
      Watchmen stack.
    description: >
      The first defensive investment. Pays off cumulatively across the
      game — every raid attempt against you reads its bonus. Two
      Watchmen take the attacker's odds at X=0 from ~42% to ~28%.
    implemented: true

  - defId: cellar_foreman
    name: Cellar Foreman
    tier: small
    cost: 4
    category: deck
    triggers: [turn_start]
    archetype: flex
    rate_limited: true
    rate_limit_scope: 1/round
    short: Draw before aging
    text: >
      At the start of your turn, after rolling demand but before
      paying aging costs, draw 1 card. Once per round.
    description: >
      Repurposed in v3.5 from a broken 'skip aging' design. Aging
      cards ARE age (v3.5 invariant), so no card can advance age
      without committing one. Cellar Foreman now pays a small draw
      instead — helps cover aging commits.
    implemented: true

  # ─── Medium (cost 5–8) ────────────────────────────────────────
  - defId: marketing_department
    name: Marketing Department
    tier: medium
    cost: 5
    category: demand
    triggers: [turn_start]
    archetype: flex
    rate_limited: true
    rate_limit_scope: 1/round
    short: Reroll one demand die
    text: >
      At the start of your turn, after rolling your 2d6 demand
      roll, you may reroll one of the two dice. Once per round.
    description: >
      Smooths variance on the demand check that opens your turn.
      Useful for hot-market specialists who need a specific demand
      to fire their on-sell bonuses.
    implemented: false

  - defId: trade_lobby
    name: Trade Lobby
    tier: medium
    cost: 6
    category: demand
    triggers: [turn_start]
    archetype: flex
    rate_limited: true
    rate_limit_scope: 1/round
    short: Nudge demand each round
    text: >
      At the start of your turn, after rolling demand, you may
      shift demand by ±1 (your choice). Once per round.
    description: >
      Direct demand control. Asymmetric — only the owner gets the
      nudge.
    implemented: true

  - defId: distillery_tour_program
    name: Distillery Tour Program
    tier: medium
    cost: 6
    category: demand
    triggers: [passive_permanent]
    archetype: flex
    rate_limited: false
    short: Personal demand floor of 4
    text: >
      For all of your own bourbon sales and grid lookups, treat
      current demand as 4 if it would otherwise be lower. Other
      players' sales and demand interactions are unaffected.
    description: >
      Asymmetric, single-player benefit. Doesn't modify the shared
      demand track. Repurposed in v3.5 from a clunkier draft.
    implemented: true

  - defId: hedge_fund
    name: Hedge Fund
    tier: medium
    cost: 7
    category: sales
    triggers: [on_sell]
    archetype: tempo
    rate_limited: false
    short: Hot markets pay extra
    text: >
      When you sell at demand 8 or higher, gain +3 Capital. Demand
      does not drop from your sale.
    description: >
      A boom-time amplifier. Sells into hot markets are already
      the best sales — Hedge Fund makes them dramatically better,
      and prevents the usual 'selling tanks demand' feedback loop.
      Useless if you sell into low markets.
    implemented: true

  - defId: rd_department
    name: R&D Department
    tier: medium
    cost: 8
    category: market
    triggers: [on_buy_market]
    archetype: specialty
    rate_limited: false
    short: Specialty cards, half off
    text: >
      When you buy a Specialty or Heritage card from the market,
      that card costs 1 less Capital (floor 1).
    description: >
      v3.5 simplification — the old 'plus to hand' clause is
      redundant now that all market purchases route to hand by
      default. Only the Capital discount remains.
    implemented: true

  - defId: master_blender
    name: Master Blender
    tier: medium
    cost: 7
    category: production
    triggers: [on_make]
    archetype: flex
    rate_limited: false
    short: Corn extremes pay off
    text: >
      When you complete a recipe with committed corn count ≤ 2 or
      ≥ 5, gain +2 Capital and +1 Reputation. The +1 Reputation
      banks immediately and is not subject to portfolio scoring.
    description: >
      One of two cards in the catalog that pays Reputation
      directly (the other is the endgame trio). Plays into the
      corn-extreme tags (corn-light / corn-heavy).
    implemented: true

  - defId: estate_bottling
    name: Estate Bottling
    tier: medium
    cost: 8
    category: endgame
    triggers: [on_purchase, passive_permanent]
    archetype: engine
    rate_limited: false
    short: Make secondaries safer
    text: >
      On purchase: the next time you take the Draft Second
      Portfolio action, it costs 0 Generic Labor instead of 1. For
      the rest of the game, your second portfolio's failure
      penalty is reduced to 1 Reputation per unfilled required
      slot (cap −5 instead of −10).
    description: >
      Dedicated second-portfolio enabler. Mandatory for Vanilla's
      flagship Mastery, which requires a second portfolio. The
      free draft is a one-shot; the reduced penalty is permanent.
    implemented: true

  - defId: heritage_cooperage
    name: Heritage Cooperage
    tier: medium
    cost: 7
    category: production
    triggers: [on_sell]
    archetype: specialty
    rate_limited: false
    short: Heritage commits return on sale
    text: >
      When you sell a barrel whose completed recipe used at least
      one Heritage card, return all Heritage cards from that
      barrel to your hand instead of to discard.
    description: >
      Heritage recycling. Renamed from 'Heritage Cellars' in v3.5
      for thematic accuracy — a cooperage builds casks, which is
      where the Heritage component lives.
    implemented: true

  - defId: bottling_line
    name: Bottling Line
    tier: medium
    cost: 8
    category: sales
    triggers: [on_sell]
    archetype: engine
    rate_limited: true
    rate_limit_scope: 1/round
    short: Reclaim your cask
    text: >
      The first time each round you sell a barrel, return the cask
      card from that barrel to your hand instead of your discard.
    description: >
      Cask-recycling engine. Pairs with Cooperage (which refunds
      the first cask commit each round) for tight cask economy.
    implemented: true

  - defId: yeast_lab
    name: Yeast Lab
    tier: medium
    cost: 6
    category: production
    triggers: [on_make]
    archetype: patience
    rate_limited: true
    rate_limit_scope: 1/round
    short: Reliable fermentation
    text: >
      The first time each round you complete a recipe (the barrel
      transitions from Building to Aging), draw 2 cards.
    description: >
      Pays the completion moment, not the commit moment — rewards
      finishing recipes rather than starting them.
    implemented: true

  - defId: bottling_plant
    name: Bottling Plant
    tier: medium
    cost: 7
    category: sales
    triggers: [on_sell]
    archetype: volume
    rate_limited: false
    short: Streamlined operations
    text: When you sell a barrel, draw 1 card and gain +1 Capital. No round limit.
    description: >
      Steady sales engine — pays per barrel, every barrel, no
      gates. The volume-archetype workhorse at this price point.
    implemented: true

  - defId: sales_office
    name: Sales Office
    tier: medium
    cost: 7
    category: market
    triggers: [turn_start]
    archetype: flex
    rate_limited: true
    rate_limit_scope: 1/round
    short: Pre-market briefing
    text: >
      At the start of your turn, look at the top 3 cards of the
      market supply deck. You may rearrange them or discard one
      (refill from supply if discarded). Once per round.
    description: >
      Information + light control over the market refresh. Useful
      for timing a Specialty/Heritage drop.
    implemented: false

  - defId: rickhouse_office
    name: Rickhouse Office
    tier: medium
    cost: 6
    category: deck
    triggers: [turn_start]
    archetype: tempo
    rate_limited: true
    rate_limit_scope: 1/round
    short: Draw two before aging
    text: >
      At the start of your turn, after rolling demand but before
      paying aging costs, draw 2 cards. Once per round.
    description: >
      Repurposed in v3.5 from a broken 'skip aging' design — under
      the v3.5 invariant, aging cards ARE age. Rickhouse Office
      now buys you the cards to pay the cost, two at a time.
      Steeper price than Cellar Foreman; doubled draw.
    implemented: true

  - defId: cooperage
    name: Cooperage
    tier: medium
    cost: 6
    category: production
    triggers: [on_make]
    archetype: engine
    rate_limited: true
    rate_limit_scope: 1/round
    short: First cask, free
    text: >
      The first time each round you commit any cask card (Common,
      Specialty, or Heritage) to a barrel, return that cask to
      your hand instead of locking it with the barrel.
    description: >
      Cask-side engine — the cask is literally not spent on the
      first commit. Pairs with Bottling Line for double cask
      recycling.
    implemented: false

  - defId: climate_controlled_warehouse
    name: Climate-Controlled Warehouse
    tier: medium
    cost: 7
    category: aging
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: Consistent aging, no surprises
    text: >
      On purchase, designate one of your slots as
      'climate-controlled.' Barrels in this slot are immune to ops
      cards that target aging negatively (Regulatory Inspection,
      Forced Cure, others). Other players cannot interfere with
      this slot's aging.
    description: >
      Real-world AC warehouses are a controversial industry move —
      they produce more consistent but arguably less complex
      bourbon. In game terms: defensive immunity.
    implemented: true

  # ─── Large (cost 9–15) ────────────────────────────────────────
  - defId: brand_ambassador
    name: Brand Ambassador
    tier: large
    cost: 9
    category: sales
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: One barrel reads +2 demand
    text: >
      On purchase, choose one of your aging barrels. For the rest
      of the game, that specific barrel reads its grid as if
      demand were +2 when sold.
    description: >
      Strong pick for patient players who plan to age a single
      high-value barrel for many rounds.
    implemented: true

  - defId: premium_label
    name: Premium Label
    tier: large
    cost: 10
    category: sales
    triggers: [on_sell]
    archetype: specialty
    rate_limited: false
    short: Specialty barrels pay extra
    text: >
      When you sell a barrel containing 2 or more Specialty or
      Heritage cards, gain +3 Capital.
    description: >
      Rewards specialty-heavy production lines. Stacks per sale.
    implemented: true

  - defId: aging_warehouse
    name: Aging Warehouse
    tier: large
    cost: 11
    category: slots
    triggers: [on_purchase]
    archetype: engine
    rate_limited: false
    short: +1 permanent rickhouse slot
    text: >
      Permanently +1 rickhouse slot (max 6, stacks with Rickhouse
      Expansion Permit and similar effects).
    description: >
      Renamed from 'Land Acquisition' in v3.5 for thematic
      accuracy — actual physical warehouses, not real estate plays.
    implemented: true

  - defId: bonded_warehouse
    name: Bonded Warehouse
    tier: large
    cost: 12
    category: aging
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: Bonded slot returns aging cards
    text: >
      On purchase, designate one of your slots as 'bonded.' When a
      barrel in the bonded slot sells, all aging cards committed
      to it return to your hand instead of going to discard.
    description: >
      Repurposed in v3.5 from a broken 'auto-age' draft. Now an
      aging-card recycler — every long-hold barrel in the bonded
      slot pays back its aging cost on sale.
    implemented: true

  - defId: vintage_reserve
    name: Vintage Reserve
    tier: large
    cost: 13
    category: sales
    triggers: [on_sell]
    archetype: patience
    rate_limited: false
    short: Triple grid at age 7+
    text: >
      When you sell a barrel age 7 or older, triple the grid value
      of that sale (applied before tier-floor clamping).
    description: >
      Late-game patience payoff. The grid value gets tripled
      BEFORE the tier floor clamps, so high-grid bills benefit;
      low-grid bills still floor.
    implemented: true

  - defId: bourbon_hall_of_fame
    name: Bourbon Hall of Fame
    tier: large
    cost: 15
    category: endgame
    triggers: [final_scoring]
    archetype: flex
    rate_limited: false
    short: +1 Reputation per distinct bill sold
    text: >
      At the end of the game, gain +1 Reputation per distinct mash
      bill name you sold during the game (cap +6 Reputation).
    description: >
      End-game scoring card. Rewards diversification across
      distinct bills rather than repetition of one bill.
    implemented: true

  - defId: master_distiller
    name: Master Distiller
    tier: large
    cost: 12
    category: production
    triggers: [passive_permanent]
    archetype: patience
    rate_limited: false
    short: Your bills' tags expand
    text: >
      On purchase, choose any one tag from: wheated, rye-heavy,
      single-grain, triple-grain. For the rest of the game, every
      barrel you complete is treated as if its source bill carried
      that tag for slot eligibility, Brand Restriction, and
      Mastery Condition purposes.
    description: >
      Tag-expansion engine (v3.4). Lets a high-rye player pretend
      to be wheated for slot purposes, etc. The chosen tag is
      locked at purchase.
    implemented: true

  - defId: column_still
    name: Column Still
    tier: large
    cost: 10
    category: production
    triggers: [on_make]
    archetype: volume
    rate_limited: false
    short: Industrial-scale production
    text: >
      When you Make Bourbon, you may commit to up to TWO different
      Staged or Building slots in a single Make Bourbon action
      (your commit cards split across the two slots however you
      choose).
    description: >
      Renamed from 'Distillery Expansion' in v3.5. A column still
      is the real-world large-scale production unit — pairs with
      multi-bill build pushes.
    implemented: false

  - defId: climate_controlled_rickhouse
    name: Climate-Controlled Rickhouse
    tier: large
    cost: 12
    category: aging
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: All slots immune to aging interference
    text: >
      All of your rickhouse slots are treated as
      climate-controlled — barrels in any of your slots are immune
      to ops cards that target aging negatively (Regulatory
      Inspection, Forced Cure, others).
    description: >
      All-slots scaled version of Climate-Controlled Warehouse.
      Defensive blockbuster.
    implemented: true
