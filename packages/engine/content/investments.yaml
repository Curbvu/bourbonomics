# ============================================================
# Bourbonomics — Investment Card Catalog (Source of Truth)
# ============================================================
#
# This is the canonical, human-editable catalog of investment cards.
# The engine reads from `packages/engine/src/defaults.ts`
# (`defaultInvestmentCatalog`), which is a manually-maintained TypeScript
# mirror of this file. When you edit a card here, mirror the change in
# defaults.ts and re-run tests.
#
# Each card has:
#   defId           — engine identifier (snake_case, stable across tunings)
#   name            — display label
#   tier            — small (cost 2-4) | medium (cost 5-8) | large (cost 8-15)
#   cost            — market price in card-units
#   category        — primary system the card touches
#   triggers        — when the effect fires (one or more)
#   archetype       — the strategy axis this card amplifies
#   rate_limited    — true if the card has a per-round trigger cap
#   rate_limit_scope — the cap, e.g. "1/round" (only when rate_limited)
#   short           — tile tagline (≤ ~7 words)
#   text            — player-facing rule text printed on the card
#   description     — designer-facing strategic flavor / rationale
#   implemented     — true | false. False = wired up but engine does not
#                     resolve the effect yet.
#
# Lean catalog: 8 cards = 3 small · 4 medium · 1 large.

cards:
  # ─── Small (cost 2-4) ─────────────────────────────────────────
  - defId: tasting_room
    name: Tasting Room
    tier: small
    cost: 4
    category: sales
    triggers: [on_sell]
    archetype: patience
    rate_limited: false
    short: Reward the patient sale
    text: When you sell a barrel age 5 or older, gain +2 reputation.
    description: A small but reliable bonus for patient cellar play. Cheap because the age-5 gate is hard to satisfy early — a freshly-completed barrel needs three rounds of aging before this card pays out at all.
    implemented: false

  - defId: grain_contract
    name: Grain Contract
    tier: small
    cost: 4
    category: deck
    triggers: [on_make]
    archetype: volume
    rate_limited: true
    rate_limit_scope: 1/round
    short: First grain refunds a card
    text: The first time each round you commit any grain card to a barrel, draw 1 card.
    description: A modest deck-cycling engine for production-heavy players. Once per round, your first grain commitment pays you back a card — slightly offsetting the holding cost of running multiple barrels in parallel.
    implemented: false

  - defId: distillers_guild
    name: Distiller's Guild
    tier: small
    cost: 4
    category: deck
    triggers: [on_complete_recipe]
    archetype: engine
    rate_limited: false
    short: Draw on completion
    text: Whenever one of your barrels completes its recipe and enters the aging phase, draw 1 card.
    description: Pays builders. Where Grain Contract refunds the first grain each round, Distiller's Guild fires every time a recipe satisfies — pairs naturally with multi-bill production pushes and Allocation.
    implemented: false

  # ─── Medium (cost 5-8) ────────────────────────────────────────
  - defId: cooperage
    name: Cooperage
    tier: medium
    cost: 5
    category: deck
    triggers: [on_make]
    archetype: volume
    rate_limited: true
    rate_limit_scope: 1/round
    short: First cask refunds a card
    text: The first time each round you commit any cask card to a barrel, draw 1 card.
    description: Cask-side counterpart to Grain Contract. Casks are scarce — every production cycle uses one — so Cooperage rewards the player going wide on barrels.
    implemented: false

  - defId: master_distiller
    name: Master Distiller
    tier: medium
    cost: 6
    category: sales
    triggers: [round_end]
    archetype: patience
    rate_limited: false
    short: Old barrels pay rent
    text: At end of each round, gain +1 reputation for each of your aging barrels age 10 or older.
    description: Persistent patience reward. The age-10 gate is intentionally severe — by the time a barrel hits 10, the player has already paid 8+ aging cards for it. This card is the answer to 'what do I do with this hoard of old barrels' for players running the patient long-hold strategy.
    implemented: false

  - defId: hedge_fund
    name: Hedge Fund
    tier: medium
    cost: 7
    category: sales
    triggers: [on_sell]
    archetype: tempo
    rate_limited: false
    short: Hot markets pay double
    text: When you sell at demand 8 or higher, gain +3 reputation, AND demand drops by 0 instead of 1 from your sale.
    description: A boom-time amplifier. Sells into hot markets are already the best sales — Hedge Fund makes them dramatically better, and prevents the usual 'selling tanks demand' feedback loop. Useless if you sell into low markets.
    implemented: false

  - defId: brand_ambassador
    name: Brand Ambassador
    tier: large
    cost: 8
    category: sales
    triggers: [on_purchase, passive_permanent]
    archetype: patience
    rate_limited: false
    short: One barrel reads +2 demand
    text: On purchase, choose one of your aging barrels. For the rest of the game, that specific barrel reads its grid as if demand were +2 when sold.
    description: A strong pick for patient players who plan to age a single high-value barrel for many rounds.
    implemented: false

  # ─── Large (cost 8-15) ────────────────────────────────────────
  - defId: bonded_warehouse
    name: Bonded Warehouse
    tier: large
    cost: 10
    category: aging
    triggers: [on_purchase, on_age]
    archetype: engine
    rate_limited: false
    short: Aging refunds in one slot
    text: On purchase, designate one of your slots as "bonded." Whenever you commit an aging card to a barrel in the bonded slot, draw 1 card.
    description: Doesn't break the aging-card economy — the aging card is still spent. But it refunds the tempo cost, so the bonded slot becomes the home for your long-hold barrels. Pairs with Master Distiller and Tasting Room.
    implemented: false
