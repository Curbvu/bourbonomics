# ============================================================
# Bourbonomics — Distillery Catalog (Source of Truth)
# ============================================================
#
# Canonical, human-editable catalog of starting distilleries
# (v2.10 — "Identity & Economy" roster). The engine reads from
# `packages/engine/src/distilleries.ts`, which is a manually-
# maintained TypeScript mirror of this file. When you edit a
# distillery here, mirror the change in distilleries.ts and re-run
# tests.
#
# Each distillery has:
#   defId         — engine identifier (snake_case, stable)
#   name          — display label
#   bonus         — discriminator on `Distillery.bonus` (matches defId)
#   flavorText    — short tagline shown beneath the name
#   slots         — starting rickhouse slot count (default 4)
#   max_slots     — hard cap on slots (defaults to 6, omitted unless tighter)
#   max_slotted_bills — cap on simultaneously slotted bills (Connoisseur)
#   card_text     — player-facing rule text
#   description   — flavor paragraph
#   strategy_note — designer-facing strategy note
#   difficulty    — beginner | intermediate | intermediate-advanced | advanced
#   axis          — design axis (specialty, slots, baseline, etc.)
#   implemented   — true | false. v2.10 roster: all four are live.
#
# v2.10 roster:
#   1 baseline + 3 asymmetric = 4 distilleries.
#   Vanilla / High-Rye House / Wheated Baron / Connoisseur Estate.

distilleries:
  # ─── Vanilla (baseline) ────────────────────────────────────────
  - defId: vanilla
    name: Vanilla Distillery
    bonus: vanilla
    flavorText: The Symmetric Option.
    slots: 4
    mash_bill_draft_size: 0
    card_text: Four open slots. No permanent ability, no constraint.
    description: A working distillery, neither famous nor forgotten. You start with four open slots and no inheritance — every barrel you ever sell is one you built from scratch. Choose Vanilla for a level playing field, an introductory game, or when you want the game itself to be the only variable.
    strategy_note: The baseline. No quirks to read around — pure economy play.
    difficulty: beginner
    axis: baseline
    implemented: true

  # ─── High-Rye House ────────────────────────────────────────────
  - defId: high_rye_house
    name: High-Rye House
    bonus: high_rye_house
    flavorText: The Specialist.
    slots: 4
    starting_barrel:
      age: 1
      basic_bill_key: high_rye_basic
    starter_pool_mods:
      bonus_specialty_rye: 2
    sale_mods:
      bonus_rep_on_bill:
        kind: high_rye
        rep: 1
    mash_bill_draft_size: 0
    card_text: "Start with one pre-aged rye barrel (age 1) and two free Specialty Rye cards. +1 rep on any sale of a bill with minRye ≥ 1. You cannot draft or draw any mash bill that forbids rye (maxRye: 0)."
    description: Your bottles lead with pepper, baking spice, and a long dry finish. The market knows your label — the buyers who pay for a high-rye pour are the buyers you'll see again. Wheated bills don't fit the house; you ship them straight back to the bourbon discard before they ever touch your rickhouse.
    strategy_note: +1 rep on every rye-bill sale is your engine. With v2.11's uniform Specialty bonus retired, the distillery's bonus is the rye player's headline sale upside — stacks only with per-card Heritage bonuses and ops/investment effects. The wheated-bill ban thins your draft pool — you'll see fewer Epic options. Pre-aged starter sells at round 2 once it picks up its second year.
    difficulty: intermediate
    axis: specialty / rye
    implemented: true

  # ─── Wheated Baron ─────────────────────────────────────────────
  - defId: wheated_baron
    name: Wheated Baron
    bonus: wheated_baron
    flavorText: The Smooth Operator.
    slots: 4
    starting_barrel:
      age: 1
      basic_bill_key: wheated_basic
    mash_bill_draft_size: 0
    card_text: "Start with one pre-aged wheated barrel (age 1). Wheated bills (maxRye: 0) cost 1 fewer wheat to complete (floor 0). You cannot commit rye cards (Common, Specialty, or Heritage) to any production pile. Rye is still legal to spend at the market or trade away."
    description: Soft front, gentle finish, the pour grandmother poured. The Baron's brand is built on wheat — the bills you make taste like vanilla and caramel, never pepper, and the buyers who ask for them ask for them by name.
    strategy_note: The wheat discount makes wheated Epics cheaper than they look. The rye ban is brutal against four-grain bills — read recipes before drafting. Rye in hand still spends at the market, so don't trash it.
    difficulty: intermediate
    axis: specialty / wheat
    implemented: true

  # ─── Connoisseur Estate ────────────────────────────────────────
  - defId: connoisseur_estate
    name: Connoisseur Estate
    bonus: connoisseur_estate
    flavorText: The Diversified.
    slots: 4
    mash_bill_draft_size: 4
    max_slotted_bills: 4
    card_text: "Drafts 4 mash bills at setup instead of 3. Slotted-bill cap is 4 (Rickhouse Expansion Permit unlocks slots 5–6 for transferred barrels only). When you trigger a Gold award, Convert may land the Gold bill in an Open slot (no recipe check)."
    description: "A diversified portfolio: four bills in the rickhouse from day one, four buyers on retainer, and a Gold award that can reshape the lineup mid-game. The Estate plays diversification as identity — never put all your bourbon in one bill."
    strategy_note: Setup ships you Staged on every slot, so first-turn options are wider than anyone's. The Open-slot Convert is the deck-shaping move — sell a Gold, paste the recipe into an empty slot, build it next round.
    difficulty: intermediate-advanced
    axis: slots / deck-shaping
    implemented: true
